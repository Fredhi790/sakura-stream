<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Sakura Mini</title>
  <link rel="stylesheet" href="player.css">
  <link rel="stylesheet" href="effects.css">
</head>
<body>
  <div id="fx" class="fx"></div>
  <button id="restoreInterfaceBtn" class="background-view-btn restore-interface hidden" type="button" aria-label="Показать интерфейс" title="Показать интерфейс"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/></svg></button>

  <div class="mini-player" id="miniPlayer">
    <div class="cover-wrap">
      <img id="nowCover" class="cover" alt="">
    </div>
    
    <div class="info">
      <div id="nowName" class="name">Ничего не играет</div>
      <div class="track-row">
        <div id="nowTrack" class="track"><span></span></div>
        <button id="copyBtn" class="copy-btn hidden" title="Скопировать трек">⧉</button>
      </div>
    </div>

    <div class="controls">
      <button id="backgroundViewBtn" class="background-view-btn" type="button" aria-label="Показать фон" title="Показать фон"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8" cy="9" r="1.5"/><path d="m4 18 5-5 3 3 3-4 5 6"/></svg></button>
      <button id="playStopBtn" class="ctrl-btn play">▶</button>
    </div>
  </div>

  <div class="volume-row sound-panel">
    <div class="sound-label"><span class="sound-icon">♫</span><span id="volumeLabel">Громкость</span></div>
    <button id="muteBtn" class="icon-btn">🔊</button>
    <input type="range" id="volume" class="volume-slider" min="0" max="100" value="80">
    <strong id="volumeVal" class="sound-value">80%</strong>
  </div>

  <!-- Таймер в мини-плеере -->
  <div class="sleep-panel">
    <div class="sleep-heading"><span class="sleep-icon">☾</span><span><strong id="sleepLabel">Таймер сна</strong><small id="sleepDescription">Остановить радио автоматически</small></span></div>
    <select id="sleepSelect" class="sleep-select">
      <option value="5">5 минут</option>
      <option value="15">15 минут</option>
      <option value="30">30 минут</option>
      <option value="45">45 минут</option>
      <option value="60">1 час</option>
      <option value="90">1 ч 30 мин</option>
      <option value="120">2 часа</option>
    </select>
    <button id="sleepBtn" class="btn-sleep">Запустить таймер</button>
    <div id="sleepStatus" class="sleep-status" aria-live="polite">Таймер выключен</div>
  </div>

  <div class="player-note"><span class="cloud-icon">☁</span><span id="playerMessage">В эфире для тебя</span><span class="note-dot"></span></div>

  <script src="player.js"></script>
</body>
</html>
